<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nosso Tempo Juntos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="car" id="car">
    <button class="nav prev">‹</button>
    <button class="nav next">›</button>
    <div class="dots" id="dots"></div>
  </section>

  <header>
    <h1>Nós dois <span>♥</span></h1>
    <p class="since">Juntos desde 23 de novembro de 2025</p>
    <div class="cnt">
      <div class="u"><strong id="m">0</strong><small>meses</small></div>
      <div class="u"><strong id="d">0</strong><small>dias</small></div>
      <div class="u"><strong id="h">0</strong><small>horas</small></div>
      <div class="u"><strong id="mi">0</strong><small>minutos</small></div>
      <div class="u"><strong id="s">0</strong><small>segundos</small></div>
    </div>
    <p class="tot" id="tot"></p>
  </header>

  <h2>Nossas memórias</h2>
  <div class="gal" id="gal"></div>

  <footer>Cada segundo com você conta. ♥</footer>
  <div class="lb" id="lb"><img id="lbi" alt=""></div>

  <script src="script.js"></script>
</body>
</html>
